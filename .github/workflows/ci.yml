name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run python -m unittest discover -s tests -v
      - run: node --check src/app/static/app.js
      - name: Validate Compose proxy profile
        run: |
          cp .env.example .env
          docker compose --profile proxy config --quiet
      - name: Build application container
        run: docker compose build web
      - name: Validate Nginx configuration
        run: docker run --rm --add-host web:127.0.0.1 -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
