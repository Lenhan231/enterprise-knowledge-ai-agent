name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-not-a-production-secret
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run python -m unittest discover -s tests -v
      - run: node --check src/app/static/app.js
      - name: Validate Compose proxy profile
        run: |
          cp .env.example .env
          docker compose --profile proxy config --quiet
      - name: Build application container
        run: docker compose build backend-api embeddings reranker document-processing
      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend-api:127.0.0.1 -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Smoke test authenticated backend HTTP through Nginx
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^AUTH_SECRET_KEY=.*|AUTH_SECRET_KEY=ci-test-secret-key-with-at-least-32-characters|' \
            -e 's|^DEMO_VIEWER_PASSWORD=.*|DEMO_VIEWER_PASSWORD=ci-test-viewer-password|' .env
          docker compose --profile proxy up -d --no-deps backend-api proxy
          trap 'docker compose --profile proxy down' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          uv run python - <<'PY'
          import http.cookiejar
          import json
          from urllib.request import HTTPCookieProcessor, Request, build_opener
          from urllib.error import HTTPError

          base = "http://127.0.0.1:8080"
          cookies = http.cookiejar.CookieJar()
          client = build_opener(HTTPCookieProcessor(cookies))
          request = Request(
              f"{base}/api/auth/login",
              data=json.dumps({"username": "viewer", "password": "ci-test-viewer-password"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with client.open(request) as response:
              assert json.load(response)["role"] == "employee"
          with client.open(f"{base}/api/auth/me") as response:
              assert json.load(response)["role"] == "employee"
          request = Request(f"{base}/api/agents/chat", data=b"{}", headers={"Content-Type": "application/json"})
          try:
              client.open(request)
              raise AssertionError("Invalid chat payload was accepted")
          except HTTPError as error:
              assert error.code == 422
          print("Nginx HTTP health, authentication and chat input validation passed")
          PY
