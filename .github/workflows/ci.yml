name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token-not-a-production-secret
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ekai_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-db-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ekai_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --locked
      - run: uv run python -m compileall -q src tests scripts
      - run: uv run python -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src
      - run: node --check src/app/static/app.js
      - name: Validate Compose proxy profile
        run: |
          cp .env.example .env
          docker compose --profile proxy config --quiet
      - name: Build application container
        run: docker compose build backend-api retrieval-api embeddings reranker document-processing
      - name: Verify document format conversion in the parser image
        run: |
          docker compose run --rm --no-deps -T \
            -v "$PWD/tests:/app/tests:ro" --entrypoint sh document-processing -ec '
              command -v soffice
              python -c "import docling"
              python -m unittest discover -s tests/documents -t . -p test_document_formats.py -v
            '
      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend-api:127.0.0.1 -v "$PWD/docker/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t
      - name: Smoke test authenticated backend HTTP through Nginx
        run: |
          cp .env.example .env
          sed -i \
            -e 's|^AUTH_SECRET_KEY=.*|AUTH_SECRET_KEY=ci-test-secret-key-with-at-least-32-characters|' \
            -e 's|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:ci-test-db-password@host.docker.internal:5432/ekai_ci|' \
            -e 's|^DEMO_VIEWER_PASSWORD=.*|DEMO_VIEWER_PASSWORD=ci-test-viewer-password|' .env
          DATABASE_URL=postgresql://postgres:ci-test-db-password@127.0.0.1:5432/ekai_ci uv run python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              connection.execute("CREATE ROLE anon")
              connection.execute("CREATE ROLE authenticated")
              connection.execute("CREATE ROLE service_role")
              migration = Path("supabase/migrations/20261123084522_role_permission_grants.sql").read_text()
              connection.execute(migration, prepare=False)
          PY
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose --profile proxy ps || true
              docker compose --profile proxy logs --no-color --tail=100 backend-api proxy || true
            fi
            docker compose --profile proxy down
            exit "$status"
          }
          trap cleanup EXIT
          docker compose --profile proxy up -d --no-deps backend-api
          backend_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              backend_ready=1
              break
            fi
            sleep 2
          done
          [ "$backend_ready" -eq 1 ]
          docker compose --profile proxy up -d --no-deps proxy
          proxy_ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              proxy_ready=1
              break
            fi
            sleep 2
          done
          [ "$proxy_ready" -eq 1 ]
          curl --fail --silent http://127.0.0.1:8080/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
          uv run python - <<'PY'
          import http.cookiejar
          import json
          from urllib.request import HTTPCookieProcessor, Request, build_opener
          from urllib.error import HTTPError

          base = "http://127.0.0.1:8080"
          cookies = http.cookiejar.CookieJar()
          client = build_opener(HTTPCookieProcessor(cookies))
          request = Request(
              f"{base}/api/auth/login",
              data=json.dumps({"username": "viewer", "password": "ci-test-viewer-password"}).encode(),
              headers={"Content-Type": "application/json"},
          )
          with client.open(request) as response:
              assert json.load(response)["role"] == "employee"
          with client.open(f"{base}/api/auth/me") as response:
              assert json.load(response)["role"] == "employee"
          request = Request(f"{base}/api/agents/chat", data=b"{}", headers={"Content-Type": "application/json"})
          try:
              client.open(request)
              raise AssertionError("Invalid chat payload was accepted")
          except HTTPError as error:
              assert error.code == 422
          print("Nginx HTTP health, authentication and chat input validation passed")
          PY
