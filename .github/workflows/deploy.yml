name: Deploy

# Every push to main deploys the VPS (fallback) first, then — only if the VPS came back healthy — the laptop
# home-pc (main backend), then the desktop (second fallback): one machine restarts at a time, so the site always has a backend.
# Jobs run on GitHub's machines: nothing from a pull request ever runs on the servers, and fork PRs get no secrets.
on:
  push:
    branches: [main]
    # The web page (src/app/static) is deployed by Vercel on its own; pushes that change only it or docs skip this.
    paths-ignore:
      - "src/app/static/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vps:
    name: VPS (fallback backend)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The VPS's public SSH port only admits the team's IPs (provider firewall), so the job reaches it over the
      # tailnet instead, still with OpenSSH and the deploy-only key.
      - name: Join the tailnet as tag:ci
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over SSH (tailnet)
        env:
          VPS_DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          vps_ip=$(tailscale ip -4 vps)
          # Same host keys as the public address, listed under the VPS's tailnet address.
          printf '%s\n' "$VPS_KNOWN_HOSTS" | sed -E "s/^[^ ]+ /$vps_ip /" > ~/.ssh/known_hosts
          # On the VPS this key may only run scripts/deploy/deploy.sh (forced command), so no command is sent.
          ssh -i ~/.ssh/deploy -o BatchMode=yes -o ServerAliveInterval=30 "root@$vps_ip"

  home-pc:
    name: Laptop home-pc (main backend)
    needs: vps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Join the tailnet as tag:ci
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over Tailscale SSH
        run: tailscale ssh eroz@home-pc 'DEPLOY_DIR="$HOME/projects/ekai-prod" bash -s' < scripts/deploy/deploy.sh

  desktop:
    name: Desktop (second fallback)
    # After the laptop job (whatever its result) and only if the VPS is healthy, so at most one backend restarts at a time.
    needs: [vps, home-pc]
    if: ${{ !cancelled() && needs.vps.result == 'success' }}
    # The desktop is often switched off; that must not turn the whole deploy red.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Join the tailnet as tag:ci
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Deploy over Tailscale SSH
        run: tailscale ssh eroz@desktop 'DEPLOY_DIR="$HOME/projects/ekai-prod" bash -s' < scripts/deploy/deploy.sh
