function renderList(){let q=document.querySelector('#search').value.toLowerCase(),f=selector.value;let list=data.filter(d=>{let m=mismatches(d);if(mode==='wrong'&&!m.length)return false;if(mode==='exact'&&m.length)return false;if(mode==='invoice_no'&&!m.includes('invoice_no'))return false;if(mode==='subtotal'&&!m.includes('subtotal'))return false;if(f&&!m.includes(f))return false;return !q||d.file.toLowerCase().includes(q)||d.ocr_elements.some(e=>e.text.toLowerCase().includes(q))});document.querySelector('#list').innerHTML=list.map(d=>{let m=mismatches(d);return `<div class="item ${d.file===active?'selected':''}" data-file="${d.file}"><div class="itemline"><strong>${d.file}</strong><span class="badge ${m.length?'':'ok'}">${m.length?m.length+' mismatches':'exact'}</span></div><div class="sub">${d.quality||''} · ${d.elapsed??'—'} s · ${m.slice(0,3).join(', ')||'all fields match'}</div></div>`}).join('')||'<div class="empty">No invoices match these filters.</div>';document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{active=el.dataset.file;renderList();renderDetail()})}
function val(v){return v==null?'<em>null</em>':String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function renderDetail(){const d=data.find(x=>x.file===active);if(!d)return;const miss=mismatches(d),m=new Set(miss);const header=fields.map(k=>`<div class="field ${m.has(k)?'wrong':''}"><div class="label">${k}</div><div class="values"><div class="value expected"><span class="tag">EXPECTED</span>${val(d.expected[k])}</div><div class="value predicted"><span class="tag">PREDICTED</span>${val(d.predicted[k])}</div></div></div>`).join('');const n=Math.max((d.expected.items||[]).length,(d.predicted.items||[]).length);const items=Array.from({length:n},(_,i)=>{const a=d.expected.items?.[i]||{},b=d.predicted.items?.[i]||{};return `<div class="row"><div class="rowhead">Item ${i+1}</div><div class="itemfields">${itemFields.map(k=>`<div class="smallfield ${same(a[k],b[k],k)?'':'wrong'}"><span class="tag">${k} · expected → predicted</span>${val(a[k])} → <b>${val(b[k])}</b></div>`).join('')}</div></div>`}).join('')||'<div class="note">No expected or predicted item rows.</div>';const tables=(d.tables||[]).map((t,i)=>`<details><summary>OCR table ${i+1}</summary><pre>${val(JSON.stringify(t,null,2))}</pre></details>`).join('');document.querySelector('#detail').innerHTML=`<div class="topline"><div><h2>${d.file}</h2><div class="note">Quality: ${d.quality||'—'} · status: ${d.status} · schema valid: ${d.schema_valid} · latency: ${d.elapsed}s</div></div><span class="badge ${miss.length?'':'ok'}">${miss.length?miss.length+' mismatches':'whole invoice exact'}</span></div><section class="section"><h3>Invoice header</h3><div class="grid">${header}</div></section><section class="section"><h3>Items · expected rows: ${(d.expected.items||[]).length} · predicted rows: ${(d.predicted.items||[]).length}</h3><div class="items">${items}</div></section><section class="section"><h3>OCR evidence from saved run</h3><div class="evidence">${d.ocr_elements.map((e,i)=>`<div><span class="tag">${i+1} · ${val(e.type||'text')}</span>${val(e.text)}</div>`).join('')}</div>${tables}</section><details><summary>Raw model responses</summary><pre>${val(d.raw_response)}</pre></details>${d.parse_error?`<details open><summary>Parse error</summary><pre>${val(d.parse_error)}</pre></details>`:''}${d.error?`<details open><summary>Request error</summary><pre>${val(d.error)}</pre></details>`:''}`}
document.querySelector('#search').addEventListener('input',renderList);selector.addEventListener('change',renderList);document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));mode=b.dataset.mode;renderList()});renderList();renderDetail();
</script></body></html>
