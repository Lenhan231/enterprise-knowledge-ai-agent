    description: "Safety stock requires a reviewed demand/lead-time model and service target; these are missing."
    aliases:
      en: ["safety stock","safety-stock"]
      vi: ["tồn kho an toàn"]
    source_columns:
      commerce.inventory: [snapshot_date, product_id]
    formula: null
    aggregation: unresolved
    unit: unresolved
    provenance: unresolved
    definition_status: unresolved
    approval_status: unreviewed
