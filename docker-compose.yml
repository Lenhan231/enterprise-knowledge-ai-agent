services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"

  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on:
      web:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ekai
      POSTGRES_PASSWORD: ekai
      POSTGRES_DB: ekai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
