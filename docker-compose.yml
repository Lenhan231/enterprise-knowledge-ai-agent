version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ekai
      POSTGRES_PASSWORD: ekai
      POSTGRES_DB: ekai
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build: ./docker
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://ekai:ekai@db:5432/ekai

volumes:
  db_data:
