<text x="727.5" y="364" font-family="sans-serif" font-size="27" fill="#34263f" font-weight="700" text-anchor="middle">backend-api</text>
<text x="727.5" y="393" font-family="sans-serif" font-size="21" fill="#34263f" font-weight="400" text-anchor="middle">Auth + agent routing</text>
<text x="727.5" y="419" font-family="sans-serif" font-size="21" fill="#34263f" font-weight="400" text-anchor="middle">RAG / SQL / reports</text>
