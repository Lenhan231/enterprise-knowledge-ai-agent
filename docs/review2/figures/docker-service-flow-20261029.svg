<text x="727.5" y="638" font-family="sans-serif" font-size="20" fill="#34263f" font-weight="400" text-anchor="middle">Poll parsed → chunked</text>
<text x="727.5" y="664" font-family="sans-serif" font-size="20" fill="#34263f" font-weight="400" text-anchor="middle">Direct DB; no HTTP</text>
