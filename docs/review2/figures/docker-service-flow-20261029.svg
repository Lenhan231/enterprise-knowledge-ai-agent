<text x="335" y="717" font-family="sans-serif" font-size="19" fill="#655b70" font-weight="400" text-anchor="start">Internal HTTP services require a shared service token.</text>
<text x="335" y="746" font-family="sans-serif" font-size="19" fill="#a56a12" font-weight="400" text-anchor="start">Chunking worker does not create vectors or call the LLM.</text>
<text x="55" y="823" font-family="sans-serif" font-size="20" fill="#655b70" font-weight="400" text-anchor="start">Green: database/storage calls     Teal: model/parser HTTP calls     Amber: LLM API / chunking worker</text>
<text x="55" y="849" font-family="sans-serif" font-size="19" fill="#655b70" font-weight="400" text-anchor="start">Named volumes: embedding_model_cache + document_model_cache. Dashed ingress: deployment-specific configuration.</text>
