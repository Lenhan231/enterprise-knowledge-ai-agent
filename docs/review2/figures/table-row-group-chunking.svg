  <rect width="1600" height="900" fill="#ffffff" />
  <text x="64" y="78" class="title" font-family="sans-serif" font-size="46" fill="#34263f" font-weight="700">Table Chunking by Row Groups</text>
  <text x="64" y="123" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">Keep complete rows together. Repeat the context in every table fragment.</text>

  <text x="66" y="238" class="label" font-family="sans-serif" font-size="27" fill="#34263f" font-weight="700">Original structured table</text>
  <rect x="64" y="262" width="500" height="426" rx="14" fill="#faf8fc" stroke="#ae9fba" stroke-width="2" />
  <text x="88" y="302" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">Warehouse stock</text>
  <rect x="88" y="325" width="452" height="44" fill="#dceff0" />
  <text x="106" y="356" class="body" font-weight="700" font-family="sans-serif" font-size="24" fill="#34263f">SKU</text>
  <text x="380" y="356" class="body" font-weight="700" font-family="sans-serif" font-size="24" fill="#34263f">Qty</text>
