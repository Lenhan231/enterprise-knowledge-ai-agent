  <text x="106" y="449" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">A-02</text><text x="380" y="449" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">15</text>
  <text x="106" y="496" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">A-03</text><text x="380" y="496" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">30</text>
  <text x="106" y="543" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">A-04</text><text x="380" y="543" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">12</text>
  <text x="106" y="590" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">A-05</text><text x="380" y="590" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">8</text>
  <text x="106" y="637" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">A-06</text><text x="380" y="637" class="body" font-family="sans-serif" font-size="24" fill="#34263f" font-weight="400">25</text>
  <path d="M88 510H540" stroke="#79688b" stroke-width="2" stroke-dasharray="8 6" />

