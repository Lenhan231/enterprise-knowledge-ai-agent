  <text x="766" y="226" class="label" font-family="sans-serif" font-size="27" fill="#34263f" font-weight="700">Chunk 1 · rows 1–3</text>
  <rect x="766" y="242" width="746" height="91" rx="6" fill="#dceff0" />
  <text x="780" y="267" class="code context" font-family="monospace" font-size="23" fill="#075e63" font-weight="400">Section: Stock overview</text>
  <text x="780" y="295" class="code context" font-family="monospace" font-size="23" fill="#075e63" font-weight="400">Table: Warehouse stock</text>
  <text x="780" y="323" class="code context" font-family="monospace" font-size="23" fill="#075e63" font-weight="400">Columns: SKU | Qty</text>
  <text x="780" y="366" class="code" font-family="monospace" font-size="23" fill="#34263f" font-weight="400">Row 1: SKU: A-01 | Qty: 20</text>
  <text x="780" y="399" class="code" font-family="monospace" font-size="23" fill="#34263f" font-weight="400">Row 2: SKU: A-02 | Qty: 15</text>
  <text x="780" y="432" class="code" font-family="monospace" font-size="23" fill="#34263f" font-weight="400">Row 3: SKU: A-03 | Qty: 30</text>

  <rect x="742" y="495" width="794" height="282" rx="14" fill="#f7fafc" stroke="#ae9fba" stroke-width="2" />
  <text x="766" y="533" class="label" font-family="sans-serif" font-size="27" fill="#34263f" font-weight="700">Chunk 2 · rows 4–6</text>
  <rect x="766" y="549" width="746" height="91" rx="6" fill="#dceff0" />
  <text x="780" y="574" class="code context" font-family="monospace" font-size="23" fill="#075e63" font-weight="400">Section: Stock overview</text>
  <text x="780" y="602" class="code context" font-family="monospace" font-size="23" fill="#075e63" font-weight="400">Table: Warehouse stock</text>
  <text x="780" y="630" class="code context" font-family="monospace" font-size="23" fill="#075e63" font-weight="400">Columns: SKU | Qty</text>
  <text x="780" y="673" class="code" font-family="monospace" font-size="23" fill="#34263f" font-weight="400">Row 4: SKU: A-04 | Qty: 12</text>
  <text x="780" y="706" class="code" font-family="monospace" font-size="23" fill="#34263f" font-weight="400">Row 5: SKU: A-05 | Qty: 8</text>
  <text x="780" y="739" class="code" font-family="monospace" font-size="23" fill="#34263f" font-weight="400">Row 6: SKU: A-06 | Qty: 25</text>

  <text x="66" y="733" class="body" font-weight="700" font-family="sans-serif" font-size="24" fill="#34263f">Repeat headers, not data rows.</text>
  <text x="66" y="767" class="small" font-family="sans-serif" font-size="21" fill="#655b70" font-weight="400">Each fragment keeps its source row range.</text>
  <path d="M64 811H1536" stroke="#ae9fba" />
  <text x="64" y="845" class="small" font-family="sans-serif" font-size="21" fill="#655b70" font-weight="400">Illustrative split after 3 rows. Actual groups depend on text length (default target: 1,100 characters).</text>
  <text x="64" y="877" class="small" font-family="sans-serif" font-size="21" fill="#655b70" font-weight="400">This is the structure stage; later token bounding can split an oversized row. Context is repeated when available.</text>
<path d="M708,320 L722,328 L708,336 Z" fill="#79688b" /><path d="M708,622 L722,630 L708,638 Z" fill="#79688b" /></svg>
