<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1320" viewBox="0 0 1900 1320" font-family="Inter, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8d8c84"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><rect x="30" y="20" width="300" height="90" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="180.0" y="58.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">User</text><text x="180.0" y="85.0" text-anchor="middle" font-size="19" fill="#555">employee or admin</text><rect x="400" y="20" width="1460" height="90" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="1130.0" y="58.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Web frontend (Next.js on Vercel)</text><text x="1130.0" y="85.0" text-anchor="middle" font-size="19" fill="#555">Chat, Documents and Upload, Access Control, Dashboard, Report</text><path d="M330 65 L398 65" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="30" y="160" width="1830" height="100" rx="14" fill="#fdf1e3" stroke="#b45f06" stroke-width="2.5"/><text x="945.0" y="203.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Backend API (FastAPI services in Docker Compose)</text><text x="945.0" y="230.0" text-anchor="middle" font-size="19" fill="#555">JWT sign-in, role and permission check; every document query is filtered by the user's role</text><path d="M1130 110 L1130 158" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><path d="M650 260 L650 328" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><path d="M1205 260 L1205 328" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><text x="30" y="312" font-size="18" font-weight="700" letter-spacing="1.5" fill="#2a78d6">A. DOCUMENT UPLOAD AND OCR INGESTION</text><text x="840" y="312" font-size="18" font-weight="700" letter-spacing="1.5" fill="#2a78d6">B. QUESTION ANSWERING</text><rect x="30" y="330" width="730" height="90" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="395.0" y="368.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Upload</text><text x="395.0" y="395.0" text-anchor="middle" font-size="19" fill="#555">admin sends a file and its allowed roles; original kept in Storage</text><path d="M395 420 L395 458" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="30" y="460" width="730" height="110" rx="14" fill="#e5effa" stroke="#2a78d6" stroke-width="2.5"/><text x="395.0" y="494.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Document processing service</text><text x="395.0" y="521.5" text-anchor="middle" font-size="19" fill="#555">Docling layout and table extraction,</text><text x="395.0" y="548.5" text-anchor="middle" font-size="19" fill="#555">RapidOCR line detection + VietOCR recognition</text><path d="M265 570 L265 608" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><path d="M640 570 L640 608" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="520" y="610" width="240" height="110" rx="14" fill="#fff" stroke="#a9a8a0" stroke-width="2" stroke-dasharray="8 6"/><text x="640.0" y="644.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Invoices</text><text x="640.0" y="671.5" text-anchor="middle" font-size="19" fill="#555">LLM JSON draft,</text><text x="640.0" y="698.5" text-anchor="middle" font-size="19" fill="#555">human review</text><rect x="30" y="610" width="470" height="110" rx="14" fill="#e5effa" stroke="#2a78d6" stroke-width="2.5"/><text x="265.0" y="658.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Embedding service</text><text x="265.0" y="685.0" text-anchor="middle" font-size="19" fill="#555">multilingual-e5-base vectors</text><path d="M265 720 L265 1178" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><text x="280" y="1020" text-anchor="start" font-size="17" font-style="italic" fill="#6b6a63">indexed passages</text><path d="M640 720 L640 1178" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="655" y="1020" text-anchor="start" font-size="17" font-style="italic" fill="#6b6a63">invoice drafts</text><rect x="840" y="330" width="730" height="90" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="1205.0" y="368.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Chat request</text><text x="1205.0" y="395.0" text-anchor="middle" font-size="19" fill="#555">Knowledge mode or Auto mode</text><path d="M895 420 L895 608" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><text x="903" y="520" text-anchor="start" font-size="17" font-style="italic" fill="#6b6a63">Knowledge</text><rect x="1010" y="460" width="560" height="110" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="1290.0" y="494.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Auto mode orchestration (LangGraph)</text><text x="1290.0" y="521.5" text-anchor="middle" font-size="19" fill="#555">plan, run Knowledge or SQL subtasks,</text><text x="1290.0" y="548.5" text-anchor="middle" font-size="19" fill="#555">inspect, revise once, combine</text><path d="M1280 420 L1280 458" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><text x="1292" y="446" text-anchor="start" font-size="17" font-style="italic" fill="#6b6a63">Auto</text><path d="M1135 570 L1135 608" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><path d="M1450 570 L1450 608" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><rect x="840" y="610" width="470" height="110" rx="14" fill="#e5effa" stroke="#2a78d6" stroke-width="2.5"/><text x="1075.0" y="644.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Hybrid retrieval</text><text x="1075.0" y="671.5" text-anchor="middle" font-size="19" fill="#555">EN/VI query translation, dense + BM25</text><text x="1075.0" y="698.5" text-anchor="middle" font-size="19" fill="#555">search, role filter, RRF fusion</text><rect x="1330" y="610" width="240" height="110" rx="14" fill="#fff" stroke="#a9a8a0" stroke-width="2" stroke-dasharray="8 6"/><text x="1450.0" y="644.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">SQL agent</text><text x="1450.0" y="671.5" text-anchor="middle" font-size="19" fill="#555">supporting path:</text><text x="1450.0" y="698.5" text-anchor="middle" font-size="19" fill="#555">read-only SELECT</text><path d="M1075 720 L1075 758" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="840" y="760" width="470" height="90" rx="14" fill="#e5effa" stroke="#2a78d6" stroke-width="2.5"/><text x="1075.0" y="798.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Reranking</text><text x="1075.0" y="825.0" text-anchor="middle" font-size="19" fill="#555">cross-encoder, neighbouring passages</text><path d="M1075 850 L1075 888" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="840" y="890" width="470" height="110" rx="14" fill="#e5effa" stroke="#2a78d6" stroke-width="2.5"/><text x="1075.0" y="924.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Cited answer generation</text><text x="1075.0" y="951.5" text-anchor="middle" font-size="19" fill="#555">LLM answer with source citations,</text><text x="1075.0" y="978.5" text-anchor="middle" font-size="19" fill="#555">arithmetic and optional claim check</text><path d="M1075 1000 L1075 1038" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="840" y="1040" width="470" height="90" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="1075.0" y="1078.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Streamed response</text><text x="1075.0" y="1105.0" text-anchor="middle" font-size="19" fill="#555">SSE back to the web frontend</text><path d="M838 665 L800 665 L800 1178" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><text x="785" y="1100" text-anchor="end" font-size="17" font-style="italic" fill="#6b6a63">reads passages</text><path d="M1450 720 L1450 1178" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="1440" y="1150" text-anchor="end" font-size="17" font-style="italic" fill="#6b6a63">commerce data</text><text x="1600" y="312" font-size="18" font-weight="700" letter-spacing="1.5" fill="#2a78d6">C. SUPPORTING</text><path d="M1810 260 L1810 328" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="1600" y="330" width="260" height="90" rx="14" fill="#fff" stroke="#c3c2b7" stroke-width="2"/><text x="1730.0" y="368.0" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Request</text><text x="1730.0" y="395.0" text-anchor="middle" font-size="19" fill="#555">Dashboard or Report page</text><path d="M1730 420 L1730 458" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="1600" y="460" width="260" height="170" rx="14" fill="#fff" stroke="#a9a8a0" stroke-width="2" stroke-dasharray="8 6"/><text x="1730.0" y="497.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Dashboard builder</text><text x="1730.0" y="524.5" text-anchor="middle" font-size="19" fill="#555">LLM plans the charts,</text><text x="1730.0" y="551.5" text-anchor="middle" font-size="19" fill="#555">queries run through</text><text x="1730.0" y="578.5" text-anchor="middle" font-size="19" fill="#555">the SQL agent,</text><text x="1730.0" y="605.5" text-anchor="middle" font-size="19" fill="#555">renders and saves tiles</text><path d="M1860 375 L1878 375 L1878 750 L1862 750" fill="none" stroke="#8d8c84" stroke-width="2.2" marker-end="url(#a)"/><rect x="1600" y="690" width="260" height="200" rx="14" fill="#fff" stroke="#a9a8a0" stroke-width="2" stroke-dasharray="8 6"/><text x="1730.0" y="742.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Report generator</text><text x="1730.0" y="769.5" text-anchor="middle" font-size="19" fill="#555">sections grounded on</text><text x="1730.0" y="796.5" text-anchor="middle" font-size="19" fill="#555">SQL agent rows and</text><text x="1730.0" y="823.5" text-anchor="middle" font-size="19" fill="#555">retrieved passages,</text><text x="1730.0" y="850.5" text-anchor="middle" font-size="19" fill="#555">with DOCX export</text><path d="M1598 590 L1545 590 L1545 608" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1598 705 L1572 705" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1598 742 L1290 742 L1290 722" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><path d="M1730 890 L1730 1178" fill="none" stroke="#8d8c84" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a)"/><text x="1745" y="1100" text-anchor="start" font-size="17" font-style="italic" fill="#6b6a63">saved reports</text><rect x="30" y="1180" width="1830" height="110" rx="14" fill="#f4f3ee" stroke="#8d8c84" stroke-width="2.5"/><text x="945.0" y="1214.5" text-anchor="middle" font-size="22" font-weight="700" fill="#111">Supabase (PostgreSQL + pgvector, Storage)</text><text x="945.0" y="1241.5" text-anchor="middle" font-size="19" fill="#555">document_chunks with allowed_roles, original files, invoice drafts, commerce schema,</text><text x="945.0" y="1268.5" text-anchor="middle" font-size="19" fill="#555">users and roles, chat history and feedback, saved dashboards and reports</text></svg>