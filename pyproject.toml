[project]
name = "enterprise-knowledge-ai-agent"
version = "0.1.0"
description = "Source-grounded enterprise document QA and Commerce decision support"
readme = "README.md"
authors = [
    { name = "Lenhan231", email = "nhanle221199@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "huggingface-hub>=1.0.0",
    "jinja2==3.1.6",
    "langchain-core==1.4.0",
    "langchain-experimental==0.4.2",
    "langchain-huggingface>=1.2.2",
    "openai==2.41.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic==2.11.7",
    "asyncpg>=0.32.0",
    "python-docx>=1.2,<2",
    "pymupdf==1.27.2.3",
    "python-dotenv==1.1.1",
    "python-multipart==0.0.32",
    "sentence-transformers>=6.0.1",
    "supabase>=2.31.0",
    "uvicorn==0.35.0",
    "pgvector>=0.5.0",
    "numpy>=2.4.6",
    "groq>=1.7.0",
    "pyjwt==2.14.0",
    "langgraph>=1.2.4",
    "sqlglot>=30.19.0",
    "pillow==12.3.0",
]

[project.optional-dependencies]
ocr-paddle = ["paddleocr>=3.0.3", "paddlepaddle>=3.3.1", "paddlex[ocr]==3.4.3"]
layout-yolo = ["doclayout-yolo==0.0.4"]
docling = ["docling==2.129.0", "opencv-python-headless"]
document-processing-ui = ["streamlit>=1.40,<2"]
evaluation = [
    "grits-metric==0.6.1",
    "pyvi==0.1.1",
    "rapidfuzz>=3.14.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
