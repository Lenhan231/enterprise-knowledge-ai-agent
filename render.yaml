services:
  - type: web
    name: enterprise-knowledge-ai-api-lenhanm1
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_SECRET_KEY
        generateValue: true
      - key: SUPABASE_DOCUMENT_BUCKET
        value: enterprise-documents
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: EMBEDDING_BACKEND
        value: huggingface_inference
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: DOCUMENT_CHUNKING_STRATEGY
        value: sentence
      - key: DOCUMENT_PADDLE_LAYOUT
        value: "false"
      - key: DOCUMENT_PADDLE_FORMULA_RECOGNITION
        value: "false"
      - key: EMBEDDING_MAX_SEQUENCE_LENGTH
        value: "512"
      - key: DEMO_VIEWER_USERNAME
        value: viewer
      - key: DEMO_VIEWER_PASSWORD
        sync: false
      - key: DEMO_ANALYST_USERNAME
        value: analyst
      - key: DEMO_ANALYST_PASSWORD
        sync: false
      - key: DEMO_SUSTAINABILITY_ANALYST_USERNAME
        value: sustainability
      - key: DEMO_SUSTAINABILITY_ANALYST_PASSWORD
        sync: false
      - key: DEMO_ADMIN_USERNAME
        value: admin
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_UPLOADER_USERNAME
        value: uploader
      - key: DEMO_UPLOADER_PASSWORD
        sync: false
